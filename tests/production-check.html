<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Production cheek integration checks</title>
  <style>body{margin:12px;background:#111;color:#eee;font:13px/1.4 system-ui}button{padding:8px;font:inherit}pre{white-space:pre-wrap}iframe{display:block;width:390px;height:844px;border:1px solid #555;margin-top:10px}</style>
</head>
<body>
  <button id="run">Run integration checks</button>
  <pre id="result">Loading actual site in the test frame…</pre>
  <iframe id="site" title="Actual production viewer with test instrumentation" src="/tests/production-viewer.html"></iframe>
  <script type="module">
    const iframe = document.querySelector('#site'), button = document.querySelector('#run'), output = document.querySelector('#result');
    let child, debug, environment, canvas;
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    async function ready() {
      for(let attempt = 0; attempt < 200; attempt++) {
        child = iframe.contentWindow;
        if(child.qaDebug?.state.model && child.document.querySelector('canvas.ready')) {
          debug = child.qaDebug; environment = child.qaEnvironment; canvas = child.document.querySelector('canvas');
          debug.stop(); return;
        }
        await wait(50);
      }
      throw Error('Production model did not become ready within 10 seconds');
    }
    const magnitude = () => Math.max(0, ...debug.state.cheeks.flatMap(cheek => cheek.offsets.map(offset => offset.length())));
    const finite = () => debug.state.cheeks.every(cheek => cheek.offsets.every(offset => [offset.x,offset.y,offset.z].every(Number.isFinite)));
    function baseline() {debug.fit(); debug.stop(); debug.resetMotion(); debug.stop();}
    function frames(count = 1) {for(let i = 0; i < count; i++) debug.step();}
    function key(value) {canvas.dispatchEvent(new child.KeyboardEvent('keydown', {key:value, bubbles:true, cancelable:true}));}
    function pointer(type, id, x, y, pointerType = 'mouse') {
      canvas.dispatchEvent(new child.PointerEvent(type, {pointerId:id, pointerType, clientX:x, clientY:y, button:0, buttons:type === 'pointerup' ? 0 : 1, isPrimary:id === 1, bubbles:true, cancelable:true}));
    }
    function drag(pointerType = 'mouse', dx = 100, dy = 0) {
      const box = canvas.getBoundingClientRect(), x = box.left+box.width*.45, y = box.top+box.height*.55;
      pointer('pointerdown', 1, x, y, pointerType);
      let peak = 0;
      for(let i = 1; i <= 8; i++) {pointer('pointermove', 1, x+dx*i/8, y+dy*i/8, pointerType); frames(); peak = Math.max(peak, magnitude());}
      pointer('pointerup', 1, x+dx, y+dy, pointerType);
      return peak;
    }
    function cameraAngle(angle) {
      const {camera, controls} = debug.state;
      const relative = camera.position.clone().sub(controls.target);
      const spherical = {radius:relative.length(), phi:controls.getPolarAngle(), theta:angle};
      camera.position.copy(controls.target).add(relative.setFromSpherical(spherical));
      controls.update();
    }
    async function run() {
      button.disabled = true; output.textContent = 'Checking actual input and lifecycle handlers…';
      const checks = [];
      const check = (name, passed, detail) => checks.push({name, passed:Boolean(passed), detail});
      try {
        await ready();
        baseline(); check('initial fit has zero motion', magnitude() === 0, magnitude());
        for(const [name, pointerType, dx, dy] of [['mouse horizontal','mouse',100,0], ['touch vertical','touch',0,90], ['touch diagonal','touch',80,60]]) {
          baseline(); const start = debug.state.controls.getAzimuthalAngle(), peak = drag(pointerType,dx,dy);
          check(name+' drives bounded cheek motion', peak > .0001 && peak <= .020001 && finite(), {peak, azimuthChange:debug.state.controls.getAzimuthalAngle()-start});
          frames(100); check(name+' settles after release', magnitude() < .001, magnitude());
        }
        baseline(); key('ArrowLeft'); frames(); const keyboardPeak = magnitude();
        check('arrow-key orbit reaches cheeks after immediate controls update', keyboardPeak > .0001, keyboardPeak);
        baseline(); const radiusBefore = debug.state.camera.position.distanceTo(debug.state.controls.target); key('+'); frames();
        check('keyboard zoom changes radius without cheek impulse', debug.state.camera.position.distanceTo(debug.state.controls.target) < radiusBefore && magnitude() === 0, magnitude());
        baseline(); const {camera, controls} = debug.state; camera.position.sub(controls.target).multiplyScalar(1.1).add(controls.target); controls.update(); frames();
        check('dolly distance is excluded from cheek drive', magnitude() === 0, magnitude());
        baseline(); const box = canvas.getBoundingClientRect(), cx = box.left+box.width*.5, cy = box.top+box.height*.55;
        const pinchBefore = camera.position.distanceTo(controls.target);
        pointer('pointerdown',1,cx-35,cy,'touch'); pointer('pointerdown',2,cx+35,cy,'touch');
        for(let i = 1; i <= 6; i++) {pointer('pointermove',1,cx-35-i*4,cy,'touch'); pointer('pointermove',2,cx+35+i*4,cy,'touch'); frames();}
        pointer('pointerup',1,cx-59,cy,'touch'); pointer('pointerup',2,cx+59,cy,'touch');
        check('pinch zoom remains functional and bounded', camera.position.distanceTo(controls.target) < pinchBefore && magnitude() <= .020001 && finite(), {radiusBefore:pinchBefore, radiusAfter:camera.position.distanceTo(controls.target), offset:magnitude()});
        baseline(); drag(); child.document.querySelector('#noony').click(); debug.stop();
        check('Noony tab stops and resets motion', !debug.state.active && magnitude() === 0 && child.document.querySelector('#viewer').hidden && !child.document.querySelector('#soon').hidden, magnitude());
        child.document.querySelector('#salman').click(); debug.stop(); frames();
        check('Salman resume discards stale orbit damping', debug.state.active && magnitude() === 0, magnitude());
        baseline(); drag(); iframe.style.width = '420px'; child.dispatchEvent(new child.Event('resize')); debug.stop(); frames();
        check('resize refits and resets motion', magnitude() === 0 && Math.abs(camera.aspect-child.document.querySelector('#viewer').clientWidth/child.document.querySelector('#viewer').clientHeight) < 1e-9, {offset:magnitude(), aspect:camera.aspect});
        baseline(); drag(); environment.setHidden(true); debug.stop();
        check('hidden document resets cheek motion', magnitude() === 0, magnitude());
        environment.setHidden(false); debug.stop(); frames(); check('visibility resume has no stored impulse', magnitude() === 0, magnitude());
        baseline(); drag(); environment.setReduced(true); debug.stop();
        check('changing reduced-motion preference resets immediately', magnitude() === 0 && debug.state.reducedMotion, magnitude());
        key('ArrowRight'); frames(4); check('reduced motion suppresses animation during orbit', magnitude() === 0, magnitude());
        environment.setReduced(false); debug.stop(); key('ArrowLeft'); frames();
        check('animation resumes when reduced motion is disabled', magnitude() > .0001, magnitude());
        baseline(); cameraAngle(Math.PI-.001); debug.resetMotion(); frames(); cameraAngle(-Math.PI+.001); frames();
        check('azimuth wrap produces a small finite impulse', magnitude() < .005 && finite(), magnitude());
        baseline(); let repeatedPeak = 0;
        for(let i = 0; i < 24; i++) {key(i%2 ? 'ArrowLeft' : 'ArrowRight'); frames(); repeatedPeak = Math.max(repeatedPeak,magnitude());}
        frames(90); check('repeated reversing input stays bounded and settles', repeatedPeak > .0001 && repeatedPeak <= .020001 && magnitude() < .001 && finite(), {peak:repeatedPeak, settled:magnitude()});
        check('production WebGL and input handlers have no browser errors', environment.errors.length === 0, environment.errors);
        baseline();
      } catch(error) {check('integration fixture completed', false, error.stack || String(error));}
      const report = {passed:checks.every(item => item.passed), checks};
      output.textContent = JSON.stringify(report, null, 2);
      await fetch('/tests/production-report', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)});
      button.disabled = false;
    }
    button.addEventListener('click', run);
    await ready(); output.textContent = 'Actual production viewer ready. Run integration checks.';
  </script>
</body>
</html>
