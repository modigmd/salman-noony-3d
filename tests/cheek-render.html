<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cheek rendering verification</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    #qa-panel{position:fixed;bottom:8px;left:8px;right:8px;z-index:4;background:#090a0dee;border:1px solid #555;padding:8px;font:12px/1.4 system-ui;max-height:180px;overflow:auto}
    #qa-panel button,#qa-panel select{font:12px system-ui;margin:2px;padding:5px;color:#fff;background:#30333a;border:1px solid #666;border-radius:3px}
    #qa-panel pre{white-space:pre-wrap;margin:4px 0 0;font:11px/1.3 monospace}
    canvas{transition:none}
  </style>
  <script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head>
<body>
  <header><nav><button aria-selected="true">سلمان</button><button>نوني</button></nav></header>
  <main><section id="viewer"><canvas tabindex="0"></canvas></section></main>
  <aside id="qa-panel">
    <select id="angle" aria-label="View angle"><option value="0">Front</option><option value="-45">Left 45°</option><option value="45">Right 45°</option><option value="-90">Left 90°</option><option value="90">Right 90°</option></select>
    <button data-offset="none">Rest</button><button data-offset="horizontal">Horizontal</button><button data-offset="vertical">Vertical</button><button data-offset="diagonal">Diagonal</button>
    <button id="checks">Run checks</button><button id="save">Save image</button><button id="views">Save views</button><button id="hide">Hide panel</button>
    <pre id="result">Loading model…</pre>
  </aside>
  <script type="module">
    import * as THREE from 'three';
    import {OrbitControls} from '/vendor/OrbitControls.js';
    import {GLTFLoader} from '/vendor/GLTFLoader.js';
    import {CheekJiggle} from '/cheek-jiggle.js';

    const canvas = document.querySelector('canvas');
    const viewer = document.querySelector('#viewer');
    const result = document.querySelector('#result');
    const panel = document.querySelector('#qa-panel');
    const shaderErrors = [];
    const runtimeErrors = [];
    window.addEventListener('error', event => runtimeErrors.push(event.message));
    window.addEventListener('unhandledrejection', event => runtimeErrors.push(String(event.reason)));
    const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, preserveDrawingBuffer:true, powerPreference:'low-power'});
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.debug.checkShaderErrors = true;
    renderer.debug.onShaderError = (gl, program, vertex, fragment) => {
      shaderErrors.push([gl.getProgramInfoLog(program), gl.getShaderInfoLog(vertex), gl.getShaderInfoLog(fragment)].filter(Boolean).join('\n'));
    };
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(34, 1, .01, 100);
    scene.add(new THREE.HemisphereLight(0xfff5e8, 0x555b70, 2.1));
    const light = new THREE.DirectionalLight(0xffefde, 3.1); light.position.set(-3, 4, 5); scene.add(light);
    const fill = new THREE.DirectionalLight(0xc7d8ff, 1.2); fill.position.set(4, 2, -3); scene.add(fill);
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = false;
    controls.enablePan = false;
    controls.rotateSpeed = .65;
    controls.zoomSpeed = .7;
    controls.minPolarAngle = .12;
    controls.maxPolarAngle = Math.PI - .12;
    controls.touches.ONE = THREE.TOUCH.ROTATE;
    controls.touches.TWO = THREE.TOUCH.DOLLY_ROTATE;
    const model = (await new GLTFLoader().loadAsync('/assets/salman.glb')).scene;
    const originalBox = new THREE.Box3().setFromObject(model);
    model.position.sub(originalBox.getCenter(new THREE.Vector3()));
    scene.add(model);
    scene.updateMatrixWorld(true);
    const meshes = [];
    model.traverse(node => {if(node.isMesh && node.geometry.getAttribute('position')) meshes.push(node);});
    const jiggles = meshes.map(mesh => new CheekJiggle(mesh));
    const originalPositions = meshes.map(mesh => mesh.geometry.getAttribute('position').array.slice());
    const inspection = inspectMasks();
    let unchangedPositions = true;
    const size = new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3());
    let distance, basePolar, currentAngle = 0, currentOffsets = null;

    function resize() {
      camera.aspect = viewer.clientWidth / viewer.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(viewer.clientWidth, viewer.clientHeight, false);
      const fov = THREE.MathUtils.degToRad(camera.fov);
      distance = Math.max(size.y/(2*Math.tan(fov/2)), size.x/(2*Math.tan(fov/2)*camera.aspect))*1.17 + size.z/2;
      const spherical = new THREE.Spherical().setFromVector3(new THREE.Vector3(0, size.y*.04, distance));
      distance = spherical.radius;
      basePolar = spherical.phi;
      controls.target.set(0, 0, 0);
      controls.minDistance = distance*.48;
      controls.maxDistance = distance*2.4;
      render(currentOffsets, currentAngle);
    }
    function setCamera(azimuth, polar = basePolar, radius = distance) {
      camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(new THREE.Spherical(radius, polar, azimuth)));
      camera.lookAt(controls.target);
      camera.updateMatrixWorld();
    }
    function attributes(mesh) {
      return ['cheekLeft', 'cheekRight'].map(name => mesh.geometry.getAttribute(name));
    }
    // Static snapshots stay within the same Jacobian constraint as animated poses.
    function setOffsets(offsets) {
      jiggles.forEach((jiggle, meshIndex) => {
        jiggle.offsets.forEach((offset, cheek) => {
          offset.fromArray(offsets?.[cheek] ?? [0, 0, 0]);
          if(offset.length() > .020) offset.setLength(.020);
          const attr = attributes(meshes[meshIndex])[cheek];
          let minimum = 0;
          for(let i = 0; i < attr.count; i++) minimum = Math.min(minimum, attr.getX(i)*offset.x + attr.getY(i)*offset.y + attr.getZ(i)*offset.z);
          if(minimum < -.65) offset.multiplyScalar(.65/-minimum);
        });
      });
    }
    function render(offsets = null, angle = 0) {
      currentOffsets = offsets;
      currentAngle = angle;
      setCamera(THREE.MathUtils.degToRad(angle));
      controls.update();
      jiggles.forEach(jiggle => jiggle.reset(controls.getAzimuthalAngle(), controls.getPolarAngle()));
      setOffsets(offsets);
      renderer.render(scene, camera);
      return diagnostics();
    }
    function inspectMasks() {
      let affectedVertices = 0, leftVertices = 0, rightVertices = 0, seamMismatches = 0, maskEscapes = 0;
      const gradients = [];
      const positionKeys = new Map();
      meshes.forEach(mesh => {
        const position = mesh.geometry.getAttribute('position');
        const attrs = attributes(mesh);
        const meshGradients = [[], []];
        for(let i = 0; i < position.count; i++) {
          const x = position.getX(i), y = position.getY(i), z = position.getZ(i);
          const values = attrs.flatMap(attr => [attr.getX(i), attr.getY(i), attr.getZ(i), attr.getW(i)]);
          const key = `${x},${y},${z}`;
          if(positionKeys.has(key) && values.some((value, j) => value !== positionKeys.get(key)[j])) seamMismatches++;
          else positionKeys.set(key, values);
          const weights = attrs.map(attr => attr.getW(i));
          if(weights[0] > 0) leftVertices++;
          if(weights[1] > 0) rightVertices++;
          if(weights.some(weight => weight > 0)) {
            affectedVertices++;
            if(Math.abs(x-.010) <= .105 || y <= 1.240 || y >= 1.405 || z <= .170) maskEscapes++;
          }
          attrs.forEach((attr, cheek) => {
            const x = attr.getX(i), y = attr.getY(i), z = attr.getZ(i);
            if(x || y || z) meshGradients[cheek].push([x, y, z]);
          });
        }
        gradients.push(meshGradients);
      });
      return {affectedVertices, leftVertices, rightVertices, seamMismatches, maskEscapes, gradients};
    }
    function diagnostics() {
      let minimumDenominator = 1, maximumOffset = 0;
      jiggles.forEach((jiggle, meshIndex) => jiggle.offsets.forEach((offset, cheek) => {
        maximumOffset = Math.max(maximumOffset, offset.length());
        for(const gradient of inspection.gradients[meshIndex][cheek]) minimumDenominator = Math.min(minimumDenominator, 1+gradient[0]*offset.x+gradient[1]*offset.y+gradient[2]*offset.z);
      }));
      const {gradients, ...maskMetrics} = inspection;
      return {...maskMetrics, minimumDenominator, maximumOffset, unchangedPositions, shaderErrors:[...shaderErrors], runtimeErrors:[...runtimeErrors], compiledPrograms:renderer.info.programs.length};
    }
    async function report(data) {
      result.textContent = JSON.stringify(data, null, 2);
      await fetch('/tests/report', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
      return data;
    }
    async function runChecks() {
      const scenarios = [];
      for(const fps of [30, 60, 120]) for(const direction of ['horizontal', 'vertical', 'diagonal', 'reverse']) {
        const dt = 1/fps;
        jiggles.forEach(jiggle => jiggle.reset(0, basePolar));
        let peakOffset = 0, minimumDenominator = 1;
        for(let frame = 0; frame <= Math.ceil(1.3*fps); frame++) {
          const t = frame*dt;
          let motion = Math.min(t/.12, 1)*.6;
          if(direction === 'reverse' && t > .12) motion = .6-Math.min((t-.12)/.12, 1)*1.2;
          const azimuth = direction === 'vertical' ? 0 : motion;
          const polar = basePolar + (direction === 'vertical' || direction === 'diagonal' ? motion*.5 : 0);
          setCamera(azimuth, polar);
          jiggles.forEach(jiggle => jiggle.update(dt, azimuth, polar, camera));
          const metrics = diagnostics();
          peakOffset = Math.max(peakOffset, metrics.maximumOffset);
          minimumDenominator = Math.min(minimumDenominator, metrics.minimumDenominator);
        }
        renderer.render(scene, camera);
        scenarios.push({fps, direction, peakOffset, minimumDenominator, settledOffset:diagnostics().maximumOffset});
      }
      unchangedPositions = meshes.every((mesh, i) => mesh.geometry.getAttribute('position').array.every((value, j) => value === originalPositions[i][j]));
      const diagnostic = render(null, 0);
      const failures = [];
      if(diagnostic.affectedVertices !== 448) failures.push(`Expected 448 affected vertices, got ${diagnostic.affectedVertices}`);
      if(diagnostic.seamMismatches) failures.push('Duplicate positions have inconsistent weights or gradients');
      if(diagnostic.maskEscapes) failures.push('Mask affects a protected face or blanket area');
      if(!diagnostic.unchangedPositions) failures.push('Animation mutated original geometry positions');
      if(diagnostic.compiledPrograms < 1 || shaderErrors.length || runtimeErrors.length) failures.push('GPU compile or browser runtime failure');
      scenarios.forEach(scenario => {
        if(scenario.peakOffset <= 0 || scenario.peakOffset > .020001) failures.push(`${scenario.fps}fps ${scenario.direction}: unbounded or absent motion`);
        if(scenario.minimumDenominator < .34999) failures.push(`${scenario.fps}fps ${scenario.direction}: invalid normal correction`);
        if(scenario.settledOffset > .001) failures.push(`${scenario.fps}fps ${scenario.direction}: did not settle`);
      });
      return report({passed:failures.length === 0, failures, diagnostics:diagnostic, scenarios});
    }
    async function save(name = `jiggle-${currentAngle}-${currentOffsets ? 'offset' : 'rest'}`) {
      renderer.render(scene, camera);
      const response = await fetch('/tests/image', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, png:canvas.toDataURL('image/png')})});
      const data = await response.json();
      result.textContent = JSON.stringify({...diagnostics(), saved:data.path}, null, 2);
      return data;
    }
    function pixels() {
      const data = new Uint8Array(canvas.width*canvas.height*4);
      const gl = renderer.getContext();
      gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, data);
      return data;
    }
    async function saveViews() {
      const views = [];
      for(const angle of [0, -45, 45, -90, 90]) {
        const label = angle === 0 ? 'front' : (angle < 0 ? `left${-angle}` : `right${angle}`);
        render(null, angle);
        const rest = pixels();
        const restImage = await save(`jiggle-${label}-rest`);
        render(presets.horizontal, angle);
        const moved = pixels();
        let changedPixels = 0, minX = canvas.width, minY = canvas.height, maxX = -1, maxY = -1;
        for(let i = 0; i < rest.length; i += 4) if(rest[i] !== moved[i] || rest[i+1] !== moved[i+1] || rest[i+2] !== moved[i+2] || rest[i+3] !== moved[i+3]) {
          const x = (i/4)%canvas.width, y = canvas.height-1-Math.floor(i/4/canvas.width);
          changedPixels++;
          minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y);
        }
        const movedImage = await save(`jiggle-${label}-horizontal`);
        views.push({angle, changedPixels, differenceBounds:[minX, minY, maxX, maxY], diagnostics:diagnostics(), rest:restImage.path, moved:movedImage.path});
      }
      render(null, 0);
      return report({views, passed:views.every(view => view.changedPixels > 0 && view.diagnostics.minimumDenominator >= .34999), diagnostics:diagnostics()});
    }
    window.qa = {mesh:meshes[0], meshes, camera, controls, jiggle:jiggles[0], jiggles, renderer, scene, render, diagnostics, runChecks, save, saveViews};
    window.addEventListener('resize', resize);
    controls.addEventListener('change', () => {renderer.render(scene, camera);});
    const presets = {none:null, horizontal:[[.020, 0, 0], [.020, 0, 0]], vertical:[[0, .020, 0], [0, .020, 0]], diagonal:[[.014, .014, 0], [.014, .014, 0]]};
    document.querySelectorAll('[data-offset]').forEach(button => button.addEventListener('click', () => {render(presets[button.dataset.offset], Number(document.querySelector('#angle').value)); result.textContent = JSON.stringify(diagnostics(), null, 2);}));
    document.querySelector('#angle').addEventListener('change', event => {render(currentOffsets, Number(event.target.value)); result.textContent = JSON.stringify(diagnostics(), null, 2);});
    document.querySelector('#checks').addEventListener('click', runChecks);
    document.querySelector('#save').addEventListener('click', () => save());
    document.querySelector('#views').addEventListener('click', saveViews);
    document.querySelector('#hide').addEventListener('click', () => {panel.hidden = true;});
    resize();
    canvas.classList.add('ready');
    window.qaReady = true;
    await report({ready:true, diagnostics:diagnostics()});
  </script>
</body>
</html>
